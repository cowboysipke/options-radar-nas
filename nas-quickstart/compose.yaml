name: options-radar

services:
  options-radar:
    image: ghcr.io/cowboysipke/options-radar-nas:stable
    pull_policy: always
    container_name: options-radar
    restart: unless-stopped
    init: true
    shm_size: "1gb"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /data
      CONFIG_PATH: /data/config.yaml
      SETUP_HOST: 0.0.0.0
      SETUP_PORT: "8787"
      CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium
      # 管理员账户（用户名+密码）：设置后作为登录凭据，忘记密码也可在登录页用管理口令重置
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # 代理透传：容器内 OpenD 下载与 Discord REST 采集自动读取（见 .env.example）
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    ports:
      - "${HOST_PORT:-8787}:8787"
    volumes:
      - options-radar-data:/data
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  options-radar-data:
    name: options-radar-data
