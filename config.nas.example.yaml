timezone: Asia/Shanghai
database_path: /data/options_radar.db
evidence_dir: /data/evidence

discord:
  source_server: ""
  headless: true
  channel_names:
    guide: 使用指南
    subscriptions: 分析师订阅面板
    flow: 异常期权
    pa: pa分析师
    mr: mr分析师
    qmr: qmr分析师
    fqd: fqd分析师

notifications:
  provider: feishu
  feishu_app_id: ""

alpaca:
  enabled: true
  environment: paper
  data_base_url: https://data.alpaca.markets
  contracts_base_url: https://paper-api.alpaca.markets
  feed: indicative

futu:
  enabled: true
  host: 127.0.0.1
  port: 11111
  security_firm: NONE
  auto_hold_quote_right: true
  watchlist_group: Options Radar
  max_quote_age_seconds: 300

ibkr:
  enabled: false
  host: 127.0.0.1
  port: 4001
  client_id: 71
  readonly: true

providers:
  market_priority: [alpaca]
  enabled: {alpaca: true, futu: false, ibkr: false, tradier: false, massive: false, marketdata_app: false}
  portfolio: {aggregate_enabled_accounts: true}
  execution: {accepted_quality: [realtime], max_quote_age_seconds: 60, conflict_threshold_pct: 15}

ai:
  provider: deepseek
  base_url: https://api.deepseek.com
  flash_model: deepseek-v4-flash
  pro_model: deepseek-v4-pro

schedule:
  collect_interval_seconds: 60
  backfill_interval_minutes: 10
  report_delay_minutes: 75

scoring:
  recommendation_threshold: 65
  alert_threshold: 80
  disagreement_threshold: 0.25
  min_dte: 14
  max_dte: 60
  min_abs_delta: 0.30
  max_abs_delta: 0.65
  max_spread_pct: 0.12
  min_open_interest: 100
  max_snapshot_age_seconds: 60

paper:
  starting_cash: 100000
  risk_per_trade: 0.01
  max_open_positions: 5
  take_profit_pct: 0.35
  stop_loss_pct: 0.25
  max_holding_business_days: 5
  exit_before_expiry_days: 3

secret_refs:
  deepseek_api_key: /data/secrets/deepseek_api_key
  feishu_app_secret: /data/secrets/feishu_app_secret
  futu_login_password_md5: /data/secrets/futu_login_password_md5
  ibkr_flex_token: /data/secrets/ibkr_flex_token
  massive_api_key: /data/secrets/massive_api_key
  alpaca_api_key: /data/secrets/alpaca_api_key
  alpaca_api_secret: /data/secrets/alpaca_api_secret
  marketdata_api_key: /data/secrets/marketdata_api_key
  tradier_token: /data/secrets/tradier_token

setup_completed: false
