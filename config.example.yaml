timezone: Asia/Shanghai
setup_completed: false
database_path: data/options_radar.db
evidence_dir: evidence

discord:
  source_server: ""
  source_channels:
    使用指南: guide
    分析师订阅面板: subscriptions
    异常期权: flow
    pa分析师: pa
    mr分析师: mr
    qmr分析师: qmr
    fqd分析师: fqd

# 备用采集方式：把 Discord 用户 token 写入 secret_refs 指向的文件（或设置
# DISCORD_USER_TOKEN 环境变量）后，将优先使用官方 REST API 读取频道历史，
# 不再依赖浏览器 DOM 抓取。
secret_refs:
  deepseek_api_key: data-local/secrets/deepseek_api_key
  feishu_app_secret: data-local/secrets/feishu_app_secret
  discord_user_token: data-local/secrets/discord_user_token
  massive_api_key: data-local/secrets/massive_api_key

notifications:
  provider: feishu
  feishu_app_id: ""

futu:
  enabled: false
  host: 127.0.0.1
  port: 11111
  security_firm: NONE
  auto_hold_quote_right: true
  watchlist_group: Options Radar
  max_quote_age_seconds: 300

ibkr:
  enabled: true
  host: 127.0.0.1
  port: 4001
  client_id: 71
  readonly: true

providers:
  market_priority: [ibkr, massive, futu, tradier, alpaca, marketdata_app]
  enabled:
    futu: false
    ibkr: true
    tradier: false
    alpaca: false
    massive: true
    marketdata_app: false
  portfolio:
    aggregate_enabled_accounts: true
  execution:
    accepted_quality: [realtime]
    max_quote_age_seconds: 60
    conflict_threshold_pct: 15

ai:
  provider: deepseek
  base_url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  flash_model: ${DEEPSEEK_FLASH_MODEL:deepseek-v4-flash}
  pro_model: ${DEEPSEEK_PRO_MODEL:deepseek-v4-pro}

scoring:
  recommendation_threshold: 65
  alert_threshold: 80
  disagreement_threshold: 0.25
  min_dte: 14
  max_dte: 60
  min_abs_delta: 0.30
  max_abs_delta: 0.65
  max_spread_pct: 0.12
  min_open_interest: 100
  max_snapshot_age_seconds: 60

analyst_families:
  pa: price_action
  mr: momentum_reversal
  qmr: momentum_reversal
  fpd: flow_positioning
  fqd: flow_positioning

paper:
  starting_cash: 100000
  risk_per_trade: 0.01
  max_open_positions: 5
  take_profit_pct: 0.35
  stop_loss_pct: 0.25
  max_holding_business_days: 5
  exit_before_expiry_days: 3
